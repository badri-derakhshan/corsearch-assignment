name: Development
on: 
  pull-request:
    types:
      - opened
    branches:
      - master
      - develop
      - 'feat/**'
  push:
    branches:
      - master
      - develop
jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc
      
      - name: build website
        run:  npm run build
